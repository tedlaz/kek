<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEK</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="wrap">
    <h1>Αναζήτηση KΠK</h1>
    <p class="muted">Εύρεση ΚΠΚ από ΚΑΔ και Ειδικότητα</p>

    <section class="card">
      <div class="row" id="filePickerRow">
        <label>Επιλογή φακέλου <input id="fDir" type="file" webkitdirectory directory multiple /></label>
        <button id="btnLoadDir" class="secondary">Φόρτωση από φάκελο</button>
        <span id="status" class="badge">Δεν φορτώθηκαν</span>
      </div>
    </section>

    <section class="card">
      <h2>Αναζήτηση ΚΑΔ</h2>
      <input id="qKad" placeholder="Αναζήτηση με κωδικό ΚΑΔ ή περιγραφή..." />
      <div id="kadResults" class="results"></div>
    </section>

    <section class="card">
      <h2>Επιλογή ειδικότητας</h2>
      <p id="selKadInfo" class="muted">Δεν έχει επιλεγεί ΚΑΔ.</p>
      <input id="qEid" placeholder="Φιλτράρισμα λίστας ΕΙΔ με κωδικό ή περιγραφή..." />
      <div id="eidResults" class="results"></div>
    </section>

    <section class="card">
      <h2>Αποτέλεσμα ΚΠΚ</h2>
      <p id="selEidInfo" class="muted">Δεν έχει επιλεγεί Εδικότητα.</p>
      <div id="lookupOut" class="results"></div>
    </section>
  </main>

  <script src="./app.js?v=2026-02-17-6"></script>
</body>

</html>
